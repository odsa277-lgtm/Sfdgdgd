<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Chat</title>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"
  onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js';document.head.appendChild(s);"></script>
<style>
  :root {
    --bg: #eef1f6; --card: #fff; --primary: #4f46e5; --primary-dark: #4338ca;
    --mine: #4f46e5; --other: #e8eaf0; --text: #1f2430; --muted: #8a90a2; --gold: #d99a00;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center;
  }
  .chat {
    width: 100%; max-width: 560px; height: 100%; max-height: 820px;
    background: var(--card); display: flex; flex-direction: column;
    border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.12);
  }
  @media (max-width: 600px) { .chat { border-radius: 0; max-height: none; } }

  /* ADMIN PANEL (tepada) */
  #adminPanel {
    background: #1f2430; color: #fff; padding: 10px 14px; display: none;
    flex-direction: column; gap: 8px; border-bottom: 3px solid var(--gold);
  }
  #adminPanel.show { display: flex; }
  .ap-title { display: flex; justify-content: space-between; align-items: center; font-weight: 700; color: #ffd45e; }
  .ap-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .ap-row input {
    flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 8px; border: 0; font: inherit; font-size: 14px; outline: none;
  }
  .ap-row button { padding: 8px 12px; border-radius: 8px; font-size: 13px; background: var(--gold); color: #1f2430; }
  .ap-row button:hover { background: #f0ae10; }
  .ap-row button.danger { background: #ef4444; color: #fff; }
  .ap-row button.danger:hover { background: #dc2626; }
  .ap-title button { background: transparent; color: #fff; border: 1px solid #555; padding: 4px 10px; border-radius: 8px; font-size: 12px; }

  header {
    background: var(--primary); color: #fff; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .status { font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  .dot.off { background: #f87171; }
  .me { font-size: 12px; opacity: .85; cursor: pointer; text-decoration: underline; }
  #adminBtn {
    background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 12px; font-size: 12px;
  }
  #adminBtn:hover { background: rgba(255,255,255,.3); }

  #tabs { display: flex; gap: 6px; padding: 8px 12px; overflow-x: auto; background: #fff; border-bottom: 1px solid #e5e7ee; }
  .tab {
    background: #eef0f6; color: var(--text); border-radius: 16px; padding: 6px 14px; font-size: 13px; white-space: nowrap;
  }
  .tab:hover { background: #e0e3ee; }
  .tab.active { background: var(--primary); color: #fff; }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px;
    background: #f7f8fb;
  }
  .msg { position: relative; max-width: 78%; padding: 8px 12px; border-radius: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
  .msg .name { font-size: 12px; font-weight: 600; margin-bottom: 2px; color: var(--primary); }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 3px; text-align: right; }
  .msg.other { background: var(--other); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.mine { background: var(--mine); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.mine .time { color: rgba(255,255,255,.75); }
  .msg.admin .name { color: var(--gold); }
  .msg.admin.other { background: #fff4d6; border: 1px solid #f0d58a; }
  .msg.admin.mine { background: #1f2430; }
  .msg.announce {
    align-self: center; max-width: 92%; background: #fff4d6; border: 1px dashed var(--gold);
    color: #6b4a00; text-align: center; border-radius: 12px;
  }
  .msg.announce .time { text-align: center; color: #9a7a2a; }
  .del {
    display: none; position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; padding: 0;
    border-radius: 50%; background: #ef4444; color: #fff; font-size: 11px; line-height: 20px;
  }
  body.is-admin .del { display: block; }
  .empty { align-self: center; color: var(--muted); font-size: 13px; margin-top: 20px; }

  form#form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e5e7ee; background: #fff; }
  textarea {
    flex: 1; resize: none; border: 1px solid #d5d9e3; border-radius: 20px;
    padding: 10px 14px; font: inherit; max-height: 100px; outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  button {
    background: var(--primary); color: #fff; border: 0; border-radius: 20px;
    padding: 0 20px; font-weight: 600; cursor: pointer; font-size: 15px; font-family: inherit;
  }
  form#form button { padding: 10px 20px; }
  button:hover { background: var(--primary-dark); }

  /* modal oynalar */
  .modal {
    position: fixed; inset: 0; background: rgba(20,24,40,.6);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  .modal.show { display: flex; }
  .modal .box { background: #fff; padding: 28px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
  .modal h2 { margin-bottom: 14px; }
  .modal input { width: 100%; padding: 11px 14px; border: 1px solid #d5d9e3; border-radius: 10px; font-size: 16px; margin-bottom: 10px; outline: none; }
  .modal button { width: 100%; padding: 11px; border-radius: 10px; margin-top: 4px; }
  .modal button.ghost { background: #eef0f6; color: var(--text); }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<!-- Ism kiritish -->
<div class="modal show" id="login">
  <div class="box">
    <h2>👋 Xush kelibsiz!</h2>
    <input id="nameInput" maxlength="20" placeholder="Ismingizni kiriting" autofocus>
    <button id="nameBtn">Chatga kirish</button>
  </div>
</div>

<!-- Admin paroli -->
<div class="modal" id="adminModal">
  <div class="box">
    <h2>🔐 Admin kirishi</h2>
    <input id="adminPass" type="password" placeholder="Parol">
    <div class="err" id="adminErr"></div>
    <button id="adminLoginBtn">Kirish</button>
    <button class="ghost" id="adminCancel">Bekor qilish</button>
  </div>
</div>

<div class="chat">

  <!-- ADMIN PANEL -->
  <div id="adminPanel">
    <div class="ap-title">
      <span>👑 Admin panel</span>
      <button id="adminLogout">Chiqish</button>
    </div>
    <div class="ap-row">
      <input id="newRoom" maxlength="20" placeholder="Yangi chat nomi">
      <button id="addRoomBtn">➕ Chat qo'shish</button>
    </div>
    <div class="ap-row">
      <input id="announceInput" maxlength="300" placeholder="E'lon yozing (hammaga ko'rinadi)">
      <button id="announceBtn">📢 E'lon</button>
    </div>
    <div class="ap-row">
      <button class="danger" id="clearBtn">🧹 Joriy chatni tozalash</button>
      <button class="danger" id="delRoomBtn">🗑 Joriy chatni o'chirish</button>
    </div>
  </div>

  <header>
    <div>
      <h1>💬 Online Chat</h1>
      <span class="me" id="meLabel"></span>
    </div>
    <div class="right">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Ulanmoqda...</span></div>
      <button id="adminBtn">🔑 Admin</button>
    </div>
  </header>

  <div id="tabs"></div>
  <div id="messages"></div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Xabar yozing..." autocomplete="off"></textarea>
    <button type="submit">Yuborish</button>
  </form>
</div>

<script>
/* ===== SOZLAMA =====
   Chat ommaviy MQTT broker orqali ishlaydi (alohida server kerak emas).
   Faylni qaysi qurilmada ochsangiz ham, bir xil TOPIC dagilar bir-birini ko'radi.
   TOPIC ni o'zingizga xos qilib o'zgartiring, aks holda begonalar ham kirib qolishi mumkin. */
// Bir nechta broker bir vaqtda ishlatiladi: biri bloklangan bo'lsa ham chat ishlayveradi
const BROKERS = [
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://broker.emqx.io:8084/mqtt",
  "wss://test.mosquitto.org:8081"
];
const TOPIC = "gold9999-uz-chat-x7k2q9/events";
const myId = Math.random().toString(36).slice(2, 10);
const ADMIN_PASSWORD = "gold9999";

const $ = id => document.getElementById(id);
const messagesEl = $("messages"), inputEl = $("input");
const HISTORY_KEY = "chat_history_v2", ROOMS_KEY = "chat_rooms_v2", NAME_KEY = "chat_username";
const DEFAULT_ROOMS = [{ id: "general", name: "Umumiy" }];

let username = localStorage.getItem(NAME_KEY) || "";
let isAdmin = sessionStorage.getItem("chat_admin") === "1";
let rooms = [], messages = [], currentRoom = "general";
let mq = null, bc = null;

/* ===== Holat ===== */
function loadState() {
  try { rooms = JSON.parse(localStorage.getItem(ROOMS_KEY)) || DEFAULT_ROOMS; } catch (e) { rooms = DEFAULT_ROOMS; }
  try { messages = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { messages = []; }
  if (!rooms.some(r => r.id === currentRoom)) currentRoom = "general";
}
function saveRooms() { try { localStorage.setItem(ROOMS_KEY, JSON.stringify(rooms)); } catch (e) {} }
function saveMessages() { try { localStorage.setItem(HISTORY_KEY, JSON.stringify(messages.slice(-500))); } catch (e) {} }

function setStatus(online, text) {
  $("dot").classList.toggle("off", !online);
  $("statusText").textContent = text;
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString("uz-UZ", { hour: "2-digit", minute: "2-digit" });
}

/* ===== Chizish ===== */
function renderTabs() {
  const el = $("tabs"); el.innerHTML = "";
  rooms.forEach(r => {
    const b = document.createElement("button");
    b.className = "tab" + (r.id === currentRoom ? " active" : "");
    b.textContent = "# " + r.name;
    b.onclick = () => { currentRoom = r.id; renderTabs(); renderAll(); };
    el.appendChild(b);
  });
}

function buildMsg(m) {
  const div = document.createElement("div");
  div.dataset.id = m.id;
  if (m.announce) {
    div.className = "msg announce";
    const t = document.createElement("div"); t.textContent = "📢 " + m.text; div.appendChild(t);
    const tm = document.createElement("div"); tm.className = "time"; tm.textContent = fmtTime(m.ts); div.appendChild(tm);
  } else {
    const mine = m.admin ? isAdmin : (m.user === username && !isAdmin);
    div.className = "msg " + (mine ? "mine" : "other") + (m.admin ? " admin" : "");
    if (!mine || m.admin) {
      const n = document.createElement("div"); n.className = "name";
      n.textContent = m.admin ? "👑 Admin" : m.user; div.appendChild(n);
    }
    const t = document.createElement("div"); t.textContent = m.text; div.appendChild(t);
    const tm = document.createElement("div"); tm.className = "time"; tm.textContent = fmtTime(m.ts); div.appendChild(tm);
  }
  const d = document.createElement("button");
  d.className = "del"; d.textContent = "✕"; d.title = "O'chirish";
  d.onclick = () => dispatch({ type: "del", id: m.id }, true);
  div.appendChild(d);
  return div;
}

function renderAll() {
  messagesEl.innerHTML = "";
  const list = messages.filter(m => m.room === currentRoom);
  if (!list.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "Hozircha xabar yo'q. Birinchi bo'ling! ✍️";
    messagesEl.appendChild(e);
  }
  list.forEach(m => messagesEl.appendChild(buildMsg(m)));
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ===== Hodisalar (xabar, chat qo'shish, o'chirish...) ===== */
function handle(evt) {
  switch (evt.type) {
    case "msg": {
      const m = evt.m;
      if (messages.some(x => x.id === m.id)) return;
      messages.push(m); saveMessages();
      if (m.room === currentRoom) {
        const empty = messagesEl.querySelector(".empty"); if (empty) empty.remove();
        const near = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
        messagesEl.appendChild(buildMsg(m));
        if (near || m.user === username) messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      break;
    }
    case "rooms":
      rooms = evt.rooms; saveRooms();
      if (!rooms.some(r => r.id === currentRoom)) currentRoom = "general";
      renderTabs(); renderAll(); break;
    case "clear":
      messages = messages.filter(m => m.room !== evt.room); saveMessages(); renderAll(); break;
    case "del":
      messages = messages.filter(m => m.id !== evt.id); saveMessages(); renderAll(); break;
  }
}
function emit(evt) {
  pub(evt);
  if (bc) bc.postMessage(evt);
}
function dispatch(evt, broadcast) { handle(evt); if (broadcast) emit(evt); }

function sendMessage(text, announce) {
  const m = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    room: currentRoom, user: isAdmin ? "Admin" : username, admin: isAdmin, announce: !!announce,
    text, ts: Date.now()
  };
  dispatch({ type: "msg", m }, true);
}

/* ===== Ulanish ===== */
const mqs = [];
const handledSync = new Set();
const syncId = myId + "-" + Date.now();

function pub(evt) {
  const s = JSON.stringify(evt);
  mqs.forEach(c => { if (c.connected) c.publish(TOPIC, s); });
}
function updateStatus() {
  const n = mqs.filter(c => c.connected).length;
  setStatus(n > 0, n > 0 ? "Online (" + n + "/" + BROKERS.length + ")" : "Ulanmoqda...");
}
function onRemote(payload) {
  let evt; try { evt = JSON.parse(payload.toString()); } catch (_) { return; }
  if (evt.type === "sync") {
    if (evt.from === myId || handledSync.has(evt.sid)) return;
    handledSync.add(evt.sid);
    // yangi kirgan odamga tarixni yuborish
    setTimeout(() => pub({ type: "hist", to: evt.from, rooms, messages: messages.slice(-200) }), Math.random() * 1500);
  } else if (evt.type === "hist") {
    if (evt.to !== myId) return;
    const ids = new Set(rooms.map(r => r.id));
    (evt.rooms || []).forEach(r => { if (!ids.has(r.id)) rooms.push(r); });
    const have = new Set(messages.map(m => m.id));
    (evt.messages || []).forEach(m => { if (!have.has(m.id)) messages.push(m); });
    messages.sort((a, b) => a.ts - b.ts);
    saveRooms(); saveMessages(); renderTabs(); renderAll();
  } else {
    handle(evt);
  }
}
function connectMQTT(tries) {
  tries = tries || 0;
  if (typeof mqtt === "undefined") {
    if (tries > 40) { setStatus(false, "Offline (kutubxona yuklanmadi)"); return; }
    setTimeout(() => connectMQTT(tries + 1), 250); return;
  }
  BROKERS.forEach(url => {
    const c = mqtt.connect(url, {
      reconnectPeriod: 3000, connectTimeout: 8000,
      clientId: "chat_" + myId + "_" + Math.random().toString(36).slice(2, 5)
    });
    mqs.push(c);
    c.on("connect", () => {
      c.subscribe(TOPIC);
      updateStatus();
      c.publish(TOPIC, JSON.stringify({ type: "sync", from: myId, sid: syncId })); // eski tarixni so'rash
    });
    c.on("close", updateStatus);
    c.on("offline", updateStatus);
    c.on("error", () => {});
    c.on("message", (_, p) => onRemote(p));
  });
}
function connectLocal() {
  if ("BroadcastChannel" in window) {
    bc = new BroadcastChannel("online_chat_room_v2");
    bc.onmessage = e => handle(e.data);
  }
  window.addEventListener("storage", e => {
    if (e.key === HISTORY_KEY || e.key === ROOMS_KEY) { loadState(); renderTabs(); renderAll(); }
  });
  setStatus(true, "Lokal rejim");
}

/* ===== Admin ===== */
function applyAdminUI() {
  $("adminPanel").classList.toggle("show", isAdmin);
  document.body.classList.toggle("is-admin", isAdmin);
  $("adminBtn").style.display = isAdmin ? "none" : "";
  renderAll();
}
function openAdminModal() {
  $("adminPass").value = ""; $("adminErr").textContent = "";
  $("adminModal").classList.add("show"); $("adminPass").focus();
}
function adminLogin() {
  if ($("adminPass").value === ADMIN_PASSWORD) {
    isAdmin = true; sessionStorage.setItem("chat_admin", "1");
    $("adminModal").classList.remove("show"); applyAdminUI();
  } else {
    $("adminErr").textContent = "Parol noto'g'ri!";
  }
}
$("adminBtn").onclick = openAdminModal;
$("adminLoginBtn").onclick = adminLogin;
$("adminPass").addEventListener("keydown", e => { if (e.key === "Enter") adminLogin(); });
$("adminCancel").onclick = () => $("adminModal").classList.remove("show");
$("adminLogout").onclick = () => { isAdmin = false; sessionStorage.removeItem("chat_admin"); applyAdminUI(); };

$("addRoomBtn").onclick = () => {
  const name = $("newRoom").value.trim();
  if (!name) return $("newRoom").focus();
  const room = { id: "r" + Date.now(), name };
  dispatch({ type: "rooms", rooms: [...rooms, room] }, true);
  currentRoom = room.id; renderTabs(); renderAll();
  $("newRoom").value = "";
};
$("announceBtn").onclick = () => {
  const t = $("announceInput").value.trim();
  if (!t) return $("announceInput").focus();
  sendMessage(t, true); $("announceInput").value = "";
};
$("announceInput").addEventListener("keydown", e => { if (e.key === "Enter") $("announceBtn").click(); });
$("clearBtn").onclick = () => {
  if (confirm("Joriy chatdagi barcha xabarlar o'chirilsinmi?")) dispatch({ type: "clear", room: currentRoom }, true);
};
$("delRoomBtn").onclick = () => {
  if (currentRoom === "general") return alert("Asosiy chatni o'chirib bo'lmaydi.");
  if (!confirm("Bu chat butunlay o'chirilsinmi?")) return;
  const id = currentRoom;
  dispatch({ type: "clear", room: id }, true);
  dispatch({ type: "rooms", rooms: rooms.filter(r => r.id !== id) }, true);
};

/* ===== Boshlash ===== */
function start() {
  $("login").classList.remove("show");
  $("meLabel").textContent = "👤 " + username + " (o'zgartirish)";
  loadState(); renderTabs(); applyAdminUI();
  connectLocal();
  connectMQTT();
  inputEl.focus();
}
function login() {
  const v = $("nameInput").value.trim();
  if (!v) return $("nameInput").focus();
  username = v; localStorage.setItem(NAME_KEY, v); start();
}
$("nameBtn").onclick = login;
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
$("meLabel").onclick = () => {
  const v = prompt("Yangi ism:", username);
  if (v && v.trim()) {
    username = v.trim().slice(0, 20); localStorage.setItem(NAME_KEY, username);
    $("meLabel").textContent = "👤 " + username + " (o'zgartirish)"; renderAll();
  }
};

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  sendMessage(text, false);
  inputEl.value = ""; inputEl.style.height = "auto";
});
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + "px";
});

if (username) start(); else { $("login").classList.add("show"); $("nameInput").focus(); }
</script>
</body>
</html>
